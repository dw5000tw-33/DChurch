<body><main>
<section id="game">
<div class="game-heading">
<div><h1>找尋物品</h1><p class="season"><span aria-hidden="true">🍂</span> 感恩節破冰</p></div>
<button id="next">下一頁 →</button>
</div>
<ol class="items">
<li>一樣有拉鍊的東西</li>
<li>一樣上面有數字的東西（手機除外）</li>
<li>一樣忘了帶會想回家拿的東西</li>
<li>一樣可以拿來介紹自己的東西</li>
</ol>
<div class="phase" id="phase" aria-live="polite"></div>
<div class="clock" id="clock" role="timer">02:00</div>
<div class="controls timer-controls"><button class="go" id="start"><span class="bell" aria-hidden="true">🔔</span><span id="start-label">開始倒數</span></button><button id="reset">重設</button></div>
</section>
<section id="scripture" hidden>
<div class="verse">
<blockquote>你不要害怕，<br>因為我與你同在。<cite>以賽亞書 41:10</cite></blockquote>
</div>
<div class="controls verse-actions"><button id="back">← 上一頁</button><button id="read">朗讀經文</button></div>
<p class="phase" id="read-status" aria-live="polite"></p>
</section>
</main>
<script>
const ui = id => document.getElementById(id);
const duration = 120000;
let remaining = duration, deadline = 0, ticker;
function draw() {
  const seconds = Math.ceil(remaining / 1000);
  ui('clock').textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
  ui('start-label').textContent = ticker ? '暫停' : remaining === duration ? '開始倒數' : remaining ? '繼續倒數' : '再玩一次';
}
function pause() {
  clearInterval(ticker);
  ticker = undefined;
}
function reset() {
  pause();
  remaining = duration;
  ui('phase').textContent = '';
  draw();
}
function tick() {
  remaining = Math.max(0, deadline - performance.now());
  if (!remaining) {
    pause();
    ui('phase').textContent = '時間到！';
  }
  draw();
}
ui('start').onclick = () => {
  if (ticker) {
    tick();
    pause();
  } else {
    if (!remaining) reset();
    deadline = performance.now() + remaining;
    ticker = setInterval(tick, 100);
  }
  draw();
};
ui('reset').onclick = reset;
function showVerse(show) {
  if (ticker) tick();
  pause();
  draw();
  window.speechSynthesis?.cancel();
  ui('read-status').textContent = '';
  ui('game').hidden = show;
  ui('scripture').hidden = !show;
  window.scrollTo(0, 0);
  ui(show ? 'back' : 'next').focus({preventScroll:true});
}
ui('next').onclick = () => showVerse(true);
ui('back').onclick = () => showVerse(false);
ui('read').onclick = () => {
  if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) {
    ui('read-status').textContent = '這個瀏覽器無法播放朗讀。';
    return;
  }
  speechSynthesis.cancel();
  const verse = new SpeechSynthesisUtterance('你不要害怕，因為我與你同在。以賽亞書，四十一章，第十節。');
  verse.lang = 'zh-TW';
  verse.rate = .84;
  verse.onerror = event => {
    if (!['interrupted', 'canceled'].includes(event.error)) ui('read-status').textContent = '暫時無法播放朗讀。';
  };
  ui('read-status').textContent = '';
  speechSynthesis.speak(verse);
};
</script></body></html>
